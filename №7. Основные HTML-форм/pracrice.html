<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Форма участия</title>
</head>
<body>

<form>

    <label>Имя и фамилия:</label>
    <input type="text">

    <br><br>

    <label>Email:</label>
    <input type="email">

    <br><br>

    <label>Пароль:</label>
    <input type="password">

    <br><br>

    <label>Возраст:</label>
    <input type="number">

    <br><br>

    <label>Телефон:</label>
    <input type="tel">

    <br><br>

    <label>Дата рождения:</label>
    <input type="date">

    <br><br>

    <label>Город:</label>
    <select>
        <option>Бишкек</option>
        <option>Ош</option>
        <option>Каракол</option>
        <option>Талас</option>
    </select>

    <br><br>

    <label>Онлайн</label>
    <input type="radio" name="format">

    <label>Офлайн</label>
    <input type="radio" name="format">

    <br><br>

    <label>Программирование</label>
    <input type="checkbox">

    <label>Дизайн</label>
    <input type="checkbox">

    <label>Технологии</label>
    <input type="checkbox">

    <br><br>

    <label>Фото:</label>
    <input type="file">

    <br><br>

    <label>Комментарий:</label>
    <textarea></textarea>

    <br><br>

    <button type="submit">Отправить</button>

</form>

</body>
</html>
