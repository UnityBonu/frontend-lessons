<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Таблицы</title>
  <style>
    table, td, th {
      border: 1px solid #000;
    }
  </style>
</head>
<body>
  <h1>Таблицы</h1>

  <!-- row ( горизонталь ) - col ( вертикаль ) column(колона) -->

  <!-- table - тег для создания таблицы -->
  <!-- tr (table row) - 1 ряд таблицы -->
  <!-- td (table data) - 1 ячейка (1 столбец таблицы) -->
  <!-- th (table heading) - 1 ячейка с заголовком для таблицы -->
  <!-- caption - описание таблицы -->
  <!-- scope - направление, хранит либо col, либо row. Нужен для доступности и для семантики -->

  <table>
    <caption>Результаты теста по HTML/CSS</caption>

    <thead>
      <tr>
        <th scope="col">Студент</th>
        <th>Группа</th>
        <th>Максимальный балл</th>
        <th>Баллы</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <th>Шахзод</th>
        <td rowspan="3">ПКС-1-24</td>
        <td>100</td>
        <td>100</td>
      </tr>

      <tr>
        <td>Нурэл</td>
        <td>100</td>
        <td>90</td>
      </tr>

      <tr>
        <td>Алия</td>
        <td>100</td>
        <td>100</td>
      </tr>

      <tr>
        <td>Сахнира</td>
        <td rowspan="2">ПКС-2-24</td>
        <td>100</td>
        <td>99</td>
      </tr>

      <tr>
        <td>Юсуф</td>
        <td>100</td>
        <td>98</td>
      </tr>
    </tbody>

    <tfoot>
      <tr>
        <th colspan="3">Средний балл</th>
        <td>97.4</td>
      </tr>
    </tfoot>

  </table>
</body>
</html>
