<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Градиенты и тени</title>
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <h1>Градиенты и тени</h1>

  <!-- linear-gradient: цвет идёт по прямой -->
  <div class="lin"></div>

  <!-- Шкала: две точки в одном месте -->
  <div class="bar"></div>

  <!-- radial-gradient: свет из точки -->
  <div class="glow"></div>

  <!-- Градиент на кнопке -->
  <button class="btn">Играть</button>

  <!-- box-shadow: мягкая тень карточки -->
  <div class="card">Карточка</div>

    <!-- text-shadow: текст читается на фоне -->
  <h1 class="hero">Новый сезон</h1>

  <!-- text-shadow: неон -->
  <h1 class="neon">Level up</h1>
</body>
</html>
