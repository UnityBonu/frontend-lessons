<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Типографика и цвет</title>
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <!-- Карточка статьи -->
  <article class="post">
    <p class="post__date">12 марта</p>
    <h3 class="post__title">Как выбрать шрифт</h3>
    <p class="post__text">Для заголовка один шрифт, для текста другой. Так страницу легче читать.</p>
  </article>

  <!-- Текст статьи -->
  <article class="article">
    <p class="article__label">Новое на сайте</p>
    <h3 class="article__title">Почему удобно читать текст с воздухом</h3>
    <p>Когда между строками есть место, глаз легко находит следующую строку. Поэтому для текста берут line-height от 1.4 до 1.6.</p>
  </article>
</body>
</html>
